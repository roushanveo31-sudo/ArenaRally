<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - Free Fire Tournaments</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="/styles.css">
</head>
<body class="bg-gray-900 text-white flex items-center justify-center min-h-screen">
    <div class="w-full max-w-md p-8 space-y-6 bg-gray-800 rounded-lg shadow-lg">
        <h1 class="text-3xl font-bold text-center text-yellow-400">Create Your Account</h1>
        <form id="signup-form" class="space-y-4">
            <div>
                <label for="ff-uid" class="block mb-2 text-sm font-medium">Free Fire UID</label>
                <input type="number" id="ff-uid" name="ff-uid" class="w-full px-3 py-2 bg-gray-700 border border-gray-600 rounded-md focus:outline-none focus:ring-2 focus:ring-yellow-400" required>
            </div>
            <div>
                <label for="name" class="block mb-2 text-sm font-medium">Full Name</label>
                <input type="text" id="name" name="name" class="w-full px-3 py-2 bg-gray-700 border border-gray-600 rounded-md focus:outline-none focus:ring-2 focus:ring-yellow-400" required>
            </div>
            <div>
                <label for="mobile" class="block mb-2 text-sm font-medium">Mobile (WhatsApp)</label>
                <input type="tel" id="mobile" name="mobile" class="w-full px-3 py-2 bg-gray-700 border border-gray-600 rounded-md focus:outline-none focus:ring-2 focus:ring-yellow-400" required>
            </div>
            <div>
                <label for="password" class="block mb-2 text-sm font-medium">Password</label>
                <input type="password" id="password" name="password" class="w-full px-3 py-2 bg-gray-700 border border-gray-600 rounded-md focus:outline-none focus:ring-2 focus:ring-yellow-400" required>
            </div>
            <div class="border-t border-gray-700 pt-4 mt-4">
                <label for="admin-secret" class="block mb-2 text-sm font-medium text-blue-300">Admin Secret Code (Optional)</label>
                <input type="password" id="admin-secret" name="admin-secret" class="w-full px-3 py-2 bg-gray-700 border border-gray-600 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-400" placeholder="Enter code for admin registration">
            </div>
            <div>
                <label for="player-type" class="block mb-2 text-sm font-medium">Player Type</label>
                <select id="player-type" name="player-type" class="w-full px-3 py-2 bg-gray-700 border border-gray-600 rounded-md focus:outline-none focus:ring-2 focus:ring-yellow-400">
                    <option value="RUSHER">Rusher</option>
                    <option value="SNIPER">Sniper</option>
                    <option value="NGL">IGL (In-Game Leader)</option>
                    <option value="GRANADER">Grenadier</option>
                </select>
            </div>
            <div>
                <label for="ff-level" class="block mb-2 text-sm font-medium">Free Fire ID Level</label>
                <input type="number" id="ff-level" name="ff-level" class="w-full px-3 py-2 bg-gray-700 border border-gray-600 rounded-md focus:outline-none focus:ring-2 focus:ring-yellow-400" required>
            </div>
            <div>
                <label for="experience" class="block mb-2 text-sm font-medium">Years of Experience</label>
                <input type="number" id="experience" name="experience" class="w-full px-3 py-2 bg-gray-700 border border-gray-600 rounded-md focus:outline-none focus:ring-2 focus:ring-yellow-400" required>
            </div>
            <button type="submit" class="w-full py-2 font-semibold text-gray-900 bg-yellow-400 rounded-md hover:bg-yellow-500 transition-colors">Sign Up</button>
        </form>
        <div id="message" class="text-center text-red-400"></div>
        <p class="text-sm text-center">
            Already have an account? <a href="/auth/login.html" class="font-medium text-yellow-400 hover:underline">Log In</a>
        </p>
    </div>

    <script type="module" src="/auth/signup.js"></script>
</body>
</html>
