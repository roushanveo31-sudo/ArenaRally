<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Free Fire Tournaments</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="/styles.css">
</head>
<body class="bg-gray-900 text-white flex items-center justify-center min-h-screen">
    <div class="w-full max-w-md p-8 space-y-6 bg-gray-800 rounded-lg shadow-lg">
        <h1 class="text-3xl font-bold text-center text-yellow-400">Welcome Back</h1>
        <form id="login-form" class="space-y-4">
            <div>
                <label for="login-identifier" class="block mb-2 text-sm font-medium">FF UID or Mobile</label>
                <input type="text" id="login-identifier" name="login-identifier" class="w-full px-3 py-2 bg-gray-700 border border-gray-600 rounded-md focus:outline-none focus:ring-2 focus:ring-yellow-400" required>
            </div>
            <div>
                <label for="password" class="block mb-2 text-sm font-medium">Password</label>
                <input type="password" id="password" name="password" class="w-full px-3 py-2 bg-gray-700 border border-gray-600 rounded-md focus:outline-none focus:ring-2 focus:ring-yellow-400" required>
            </div>
            <button type="submit" class="w-full py-2 font-semibold text-gray-900 bg-yellow-400 rounded-md hover:bg-yellow-500 transition-colors">Log In</button>
        </form>
        <div id="message" class="text-center text-red-400"></div>
        <p class="text-sm text-center">
            Don't have an account? <a href="/auth/signup.html" class="font-medium text-yellow-400 hover:underline">Sign Up</a>
        </p>
    </div>

    <script type="module" src="/auth/login.js"></script>
</body>
</html>
