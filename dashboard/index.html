<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Player Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/styles.css">
</head>
<body class="bg-gray-900 text-white">
    <nav class="bg-gray-800 p-4 flex justify-between items-center">
        <h1 class="text-2xl font-bold text-yellow-400">Tournaments</h1>
        <div>
            <button id="global-chat-btn" class="text-gray-300 hover:text-white px-3 py-2 rounded-md text-sm font-medium">Global Chat</button>
            <a href="/dashboard/my-tournaments.html" class="text-gray-300 hover:text-white px-3 py-2 rounded-md text-sm font-medium">My Tickets</a>
            <a href="/dashboard/profile.html" class="text-gray-300 hover:text-white px-3 py-2 rounded-md text-sm font-medium">Profile</a>
            <button id="logout-btn" class="ml-4 bg-red-600 text-white font-semibold py-2 px-4 rounded hover:bg-red-700 transition-colors">
                Logout
            </button>
        </div>
    </nav>

    <main class="p-8">
        <h2 class="text-3xl font-bold mb-6">Upcoming Tournaments</h2>
        <div id="tournaments-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">
            <!-- Tournament cards will be dynamically inserted here -->
            <div id="loading" class="text-center col-span-full">Loading tournaments...</div>
        </div>
    </main>

    <!-- Global Chat Modal -->
    <div id="chat-modal" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center p-4 z-50">
        <div class="bg-gray-800 rounded-lg shadow-lg w-full max-w-2xl h-full max-h-[80vh] flex flex-col">
            <div class="flex justify-between items-center p-4 border-b border-gray-700">
                <h3 class="text-xl font-bold text-yellow-400">Global Chat</h3>
                <button id="close-chat-btn" class="text-gray-400 hover:text-white">&times;</button>
            </div>
            <div id="global-chat-messages" class="flex-grow p-4 overflow-y-auto">
                <!-- Global chat messages will be loaded here -->
            </div>
            <form id="global-chat-form" class="p-4 border-t border-gray-700 flex">
                <input type="text" id="global-chat-input" class="w-full px-3 py-2 bg-gray-700 border border-gray-600 rounded-l-md focus:outline-none" placeholder="Say something to everyone...">
                <button type="submit" class="bg-yellow-400 text-gray-900 font-semibold px-4 rounded-r-md">Send</button>
            </form>
        </div>
    </div>

    <script type="module" src="/dashboard/index.js"></script>
</body>
</html>
